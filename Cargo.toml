[package]
name = "stelly-mix-qobuz"
version = "0.1.0"
edition = "2021"
description = "stelly-mix with Qobuz as a source, through stelly-qobuz's gateway. Private: Qobuz's terms stay out of stelly-mix."
publish = false

[[bin]]
name = "stelly-mix-qobuz"
path = "src/main.rs"

[dependencies]
stelly-mix = { git = "ssh://git@github.com/nab-os/stelly-mix.git" }
# Qobuz, through the gateway that holds the account and its request queue,
# shared with Stelly.
stelly-qobuz-client = { git = "ssh://git@github.com/nab-os/stelly-qobuz.git", features = ["blocking"] }

anyhow = "1"
serde_json = "1"
# Downloads, from Qobuz's CDN.
ureq = "3"

[profile.release]
lto = true

# stelly-mix's analysis is tight loops over minutes of audio.
[profile.dev.package."*"]
opt-level = 3
