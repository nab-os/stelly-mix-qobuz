[package]
name = "stelly-mix-qobuz"
version = "0.1.0"
edition = "2021"
description = "stelly-mix with Qobuz as a source, through stelly-qobuz's gateway. Private: Qobuz's terms stay out of stelly-mix."
publish = false

[[bin]]
name = "stelly-mix-qobuz"
path = "src/main.rs"

# The window, with these sources; it wants GTK and WebKitGTK headers to
# build, see stelly-mix's README.
[[bin]]
name = "stelly-mix-qobuz-app"
path = "src/bin/app.rs"
required-features = ["app"]

[features]
app = ["dep:stelly-mix-app"]

[dependencies]
stelly-mix = { git = "https://github.com/nab-os/stelly-mix" }
stelly-mix-app = { git = "https://github.com/nab-os/stelly-mix", optional = true }
# Qobuz, through the gateway that holds the account and its request queue,
# shared with Stelly.
stelly-qobuz-client = { git = "https://github.com/nab-os/stelly-qobuz", features = ["blocking"] }

anyhow = "1"
serde_json = "1"
# Downloads, from Qobuz's CDN.
ureq = "3"

[profile.release]
lto = true

# stelly-mix's analysis is tight loops over minutes of audio.
[profile.dev.package."*"]
opt-level = 3
